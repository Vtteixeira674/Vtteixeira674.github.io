<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Loja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="style_loja.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  </head>

  <body>
    <div class="text-white text-center py-2" style="background-color: #172B4D;">
      <!--Faixa no topo-->
      Confira nossos produtos em promoção!
    </div>
    <nav class="navbar navbar-expand-lg" style="background-color: #0A0A0A;">
      <!--Menu-->
      <div class="container">
        <a class="navbar-brand" href="#">
            <img src="logo.png" alt="logo da loja" height="50">
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link text-white" href="#" >Início</a>
            </li>
            <li class="nav-item dropdown"><!--Categorias-->
              <button
                class="btn btn-secondary dropdown-toggle text-white border-0"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
                style="background-color: #0A0A0A;"
              >
                Categorias
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Processador</a></li>

                <li><a class="dropdown-item" href="#">Gabinete</a></li>

                <li><a class="dropdown-item" href="#">Mouse</a></li>

                <li><a class="dropdown-item" href="#">Teclado</a></li>

                <li><a class="dropdown-item" href="#">Placa de video</a></li>

                <li><a class="dropdown-item" href="#">Monitor</a></li>

              </ul>

            </li>
            <li class="nav-item"><a class="nav-link text-white" href="#">Ofertas</a></li>
          </ul>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Buscar produtos..."
            />
            <button class="btn btn-outline-light text-white">Buscar</button>
          </form>
            <button type="button" class="btn btn-outline-light" aria-label="Carrinho de compras">
                <i class="bi bi-cart4 text-white"></i>
            </button>
        </div>
      </div>
    </nav>
    <div class="container "><!--Miolo que vai ate os beneficios-->
        <div id="banner" class="carousel slide carousel-fade my-4 carousel-dark" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button class="active" data-bs-target="banner" data-bs-slide-to="0"></button>
                <button class="" data-bs-target="banner" data-bs-slide-to="1"></button>
                <button class="" data-bs-target="banner" data-bs-slide-to="2"></button>
            </div>
            <div class="carousel-inner" style="height: 20em;">
                <div class="carousel-item active h-100" style="background: url(produto\ 1.jpg) center/contain no-repeat ;">
                </div>
                <div class="carousel-item h-100" style="background: url(produto\ 2.jpg) center/contain no-repeat;">
                </div>
                <div class="carousel-item h-100" style="background: url(produto\ 3.jpg) center/contain no-repeat;">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#banner" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#banner" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
