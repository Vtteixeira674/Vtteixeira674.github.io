<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semana de Tecnologia IFAL</title>
  </head>
  <body>
    <header>
      <h1>Semana de Tecnologia IFAL</h1>
      <p><strong>* Campos obrigatórios</strong></p>
    </header>
    <main>
      <form
        action="https://httpbin.org/post"
        method="POST"
        enctype="multipart/form-data"
      >
        <fieldset>
          <legend>Identificação do Participante</legend>
          <label for="nome">* Nome completo:</label>
          <input type="text" id="nome" name="nome" required />
          <br /><br />
          <label for="email">* E-mail institucional:</label>
          <input type="email" id="email" name="email" required />
          <br /><br />
          <label for="cidade">Cidade de origem:</label>
          <input type="text" id="cidade" name="cidade" list="cidades" />
          <datalist id="cidades">
            <option value="Maceió"></option>
            <option value="Arapiraca"></option>
            <option value="Rio Largo"></option>
            <option value="Palmeira dos Índios"></option>
            <option value="Penedo"></option>
            <option value="União dos Palmares"></option>
            <option value="São Miguel dos Campos"></option>
            <option value="Delmiro Gouveia"></option>
          </datalist>
          <br /><br />
          <label for="foto">Foto para crachá:</label>
          <input
            type="file"
            id="foto"
            name="foto"
            accept="image/jpeg,image/png"
            aria-describedby="info-foto"
          />
          <small id="info-foto">
            Formatos aceitos: JPG e PNG. Tamanho máximo: 2 MB.
          </small>
        </fieldset>
        <br />
        <fieldset>
          <legend>Preferências para o evento</legend>
          <label for="chegada">Data e hora de chegada:</label>
          <input type="datetime-local" id="chegada" name="chegada" />
          <br /><br />
          <label for="experiencia">
            Nível de experiência: <span id="valor-experiencia">5</span>/10
          </label>
          <input
            type="range"
            id="experiencia"
            name="experiencia"
            min="0"
            max="10"
            step="1"
            value="5"
            oninput="
              document.getElementById('valor-experiencia').textContent =
                this.value
            "
          />
          <br /><br />
          <label for="cor_camiseta">Cor de preferência da camiseta:</label>
          <input
            type="color"
            id="cor_camiseta"
            name="cor_camiseta"
            value="#1a73e8"
          />
          <br /><br />
          <label for="oficinas">Oficinas de interesse:</label>
          <select
            id="oficinas"
            name="oficinas[]"
            multiple
            size="4"
            aria-describedby="info-oficinas"
          >
            <option value="web">Desenvolvimento Web</option>
            <option value="bd">Banco de Dados</option>
            <option value="ia">Inteligência Artificial</option>
            <option value="seg">Segurança da Informação</option>
            <option value="infra">Infraestrutura</option>
          </select>
          <br />
          <small id="info-oficinas">
            Use Ctrl (ou Cmd no Mac) para selecionar mais de uma oficina.
          </small>
        </fieldset>
        <input type="hidden" name="edicao" value="2026" />
        <br />
        <button type="submit">Confirmar inscrição</button>
      </form>
    </main>
    <p>
        <a href="../index.html">Volte para a pagina</a>
    </p>
  </body>
</html>
